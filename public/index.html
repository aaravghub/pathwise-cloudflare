/* Pathwise liquid-glass refresh inspired by the MFU Tracker */
:root{--pw-glass:rgba(255,255,255,.62);--pw-glass-soft:rgba(255,255,255,.34);--pw-glass-edge:rgba(255,255,255,.76);--pw-glass-shadow:0 18px 55px rgba(30,55,44,.12),inset 0 1px 0 rgba(255,255,255,.88)}
:root[data-theme="dark"]{--pw-glass:rgba(24,37,33,.66);--pw-glass-soft:rgba(12,24,20,.46);--pw-glass-edge:rgba(255,255,255,.13);--pw-glass-shadow:0 18px 55px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
html{min-height:100%;background:var(--bg)}
body{position:relative;isolation:isolate;background:transparent;min-height:100vh}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.32;will-change:transform}
body:before{width:55vmax;height:55vmax;left:-18vmax;top:-20vmax;background:#64c99b;animation:pw-aurora-a 24s ease-in-out infinite alternate}
body:after{width:52vmax;height:52vmax;right:-18vmax;bottom:-20vmax;background:#7da9f6;animation:pw-aurora-b 28s ease-in-out infinite alternate}
@keyframes pw-aurora-a{to{transform:translate(17vw,14vh) scale(1.12)}}
@keyframes pw-aurora-b{to{transform:translate(-14vw,-13vh) scale(.92)}}
.top,#nav,.topnav,.card,details.card,.hero,.tour-box,footer,.chip,.btn:not(.p),.lk,.table-wrap{border:1px solid var(--pw-glass-edge);box-shadow:var(--pw-glass-shadow);-webkit-backdrop-filter:blur(20px) saturate(165%);backdrop-filter:blur(20px) saturate(165%)}
.top{position:sticky;top:10px;z-index:25;margin:10px 14px 12px;border-radius:24px;background:linear-gradient(135deg,var(--pw-glass),var(--pw-glass-soft));padding:14px 22px}
#nav{background:linear-gradient(145deg,var(--pw-glass),var(--pw-glass-soft));border-radius:26px;inset:88px auto 14px 14px;padding:14px 8px}
#nav button{transition:transform .25s cubic-bezier(.2,1.4,.3,1),background .25s ease,border-radius .25s ease}
#nav button:hover{transform:translateX(4px);background:rgba(15,107,79,.09)}
#nav button.on{background:linear-gradient(135deg,rgba(15,107,79,.18),rgba(89,170,135,.08));border:1px solid rgba(15,107,79,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
:root[data-theme="dark"] #nav button.on{background:linear-gradient(135deg,rgba(92,199,150,.18),rgba(89,170,135,.06));border-color:rgba(126,230,174,.22)}
.content-wrap{transition:margin-left .3s ease}
.topnav{border-radius:18px;background:linear-gradient(135deg,var(--pw-glass),var(--pw-glass-soft));padding:5px;gap:5px}
.topnav button{transition:transform .22s ease,background .22s ease}
.topnav button:hover{transform:translateY(-1px)}
.topnav button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 5px 18px rgba(15,107,79,.12)}
.card{background:radial-gradient(260px circle at var(--pw-mx,-400px) var(--pw-my,-400px),rgba(255,255,255,.42),transparent 72%),linear-gradient(135deg,var(--pw-glass),var(--pw-glass-soft));border-radius:22px;transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.card:hover{border-color:rgba(255,255,255,.88)}
.hero{background:linear-gradient(135deg,rgba(15,107,79,.91),rgba(20,108,81,.72));border-radius:26px;box-shadow:0 18px 48px rgba(15,107,79,.2),inset 0 1px 0 rgba(255,255,255,.28)}
input,select,textarea{background:var(--pw-glass-soft);border:1px solid var(--pw-glass-edge);border-radius:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 17%,transparent),0 8px 24px rgba(15,107,79,.1)}
.btn{border-radius:13px;transition:transform .22s cubic-bezier(.2,1.3,.3,1),box-shadow .22s ease,filter .22s ease}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:saturate(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.p{box-shadow:0 9px 22px color-mix(in srgb,var(--acc) 25%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.chip{background:var(--pw-glass-soft);border-radius:999px}
.sc{border-radius:18px}
table{border-collapse:separate;border-spacing:0;overflow:hidden}
th{background:rgba(255,255,255,.22);backdrop-filter:blur(12px)}
td{background:rgba(255,255,255,.06)}
tr:hover td{background:rgba(15,107,79,.045)}
:root[data-theme="dark"] th{background:rgba(0,0,0,.14)}
:root[data-theme="dark"] td{background:rgba(0,0,0,.07)}
footer{max-width:900px;margin:24px auto 18px;border-radius:20px;background:var(--pw-glass-soft);padding:20px}
.tour-shade{backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%)}
.tour-box{background:linear-gradient(135deg,var(--pw-glass),var(--pw-glass-soft));border-radius:26px}
#pw-toast{backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--pw-glass-edge);border-radius:18px!important}
.pw-auth-stage{position:relative;min-height:calc(100vh - 170px);display:grid;place-items:center;padding:20px;isolation:isolate}
.pw-auth-scene{position:absolute;inset:-10px 0 0;display:grid;place-items:center;overflow:hidden;pointer-events:none;animation:pw-scene-settle 1.2s ease 2.2s both}
.pw-scene-svg{position:absolute;width:min(86vw,850px);height:auto;overflow:visible;opacity:.8}
.pw-scene-line,.pw-scene-glow{fill:none;stroke:url(#pw-line-grad);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:720;stroke-dashoffset:720}
.pw-scene-glow{stroke-width:12;opacity:.28;filter:url(#pw-glow);animation:pw-path-draw 2.5s cubic-bezier(.55,0,.25,1) .15s forwards}
.pw-scene-line{stroke-width:2.4;animation:pw-path-draw 2.5s cubic-bezier(.55,0,.25,1) .15s forwards}
@keyframes pw-path-draw{to{stroke-dashoffset:0}}
.pw-scene-orbit{position:absolute;width:min(48vw,450px);aspect-ratio:1;border:1px solid rgba(15,107,79,.14);border-radius:50%;animation:pw-orbit-spin 26s linear infinite}
.pw-orbit-one:before,.pw-orbit-two:before{content:"";position:absolute;width:9px;height:9px;top:10%;left:18%;border-radius:50%;background:#8de5bb;box-shadow:0 0 24px rgba(100,210,153,.85)}
.pw-orbit-two{width:min(65vw,620px);border-style:dashed;opacity:.6;animation-direction:reverse;animation-duration:36s}
@keyframes pw-orbit-spin{to{transform:rotate(360deg)}}
.pw-scene-brand{position:relative;z-index:0;display:grid;justify-items:center;gap:9px;color:var(--acc);font-size:12px;letter-spacing:5px;font-weight:800;animation:pw-brand-float 2.8s ease-in-out infinite}
.pw-scene-mark{display:grid;place-items:center;width:68px;height:68px;border-radius:23px;background:linear-gradient(145deg,rgba(15,107,79,.9),rgba(15,107,79,.55));color:#fff;border:1px solid rgba(255,255,255,.55);box-shadow:0 14px 40px rgba(15,107,79,.22),inset 0 1px 0 rgba(255,255,255,.5);animation:pw-mark-in .9s cubic-bezier(.2,1.3,.3,1) both}
.pw-scene-mark svg{width:40px;height:40px}
.pw-scene-brand small{font-size:9px;letter-spacing:2.4px;font-weight:700;color:var(--mute);white-space:nowrap}
@keyframes pw-brand-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pw-mark-in{from{opacity:0;transform:translateY(16px) scale(.7) rotate(-12deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pw-scene-settle{to{opacity:.28;transform:scale(1.08)}}
.pw-auth-card{position:relative;z-index:2;width:min(100%,560px);animation:pw-login-arrive .95s cubic-bezier(.2,1.15,.3,1) 1.55s both}

V.opps=()=>{const l=OPP.filter(o=>o.t.includes(S.goal)||o.t.includes('all')).sort((a,b)=>a.g-b.g);return`<h2>Internships, scholarships & competitions</h2><div class="row">${goalSel()}</div><p class="mu">Select an opportunity to open its official information page. Use the official site to check eligibility, deadlines, and application or sign-up steps; listings can change.</p><div class="grid">${l.map(o=>`<div class="card"><span class="chip">${esc(o.k)}</span><span class="chip ${S.grade>=o.g?'':'w'}">${S.grade>=o.g?'Check eligibility for your grade':'Usually grade '+o.g+'+'}</span><div class="big" style="font-size:21px;margin-top:10px"><a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(o.n)} ↗</a></div><p class="mu">${esc(o.d)}</p><a class="btn p" href="${esc(o.url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">More info & apply / sign up ↗</a></div>`).join('')}</div>`};
V.set=()=>`<h2>Settings</h2><div class="grid">
<div class="card accent-settings"><div class="lbl">Accent color</div><p class="mu">Personalize Pathwise with any color you like. This is saved on this device.</p><div class="accent-picker-row"><input type="color" id="accent-color-picker" value="${esc(localStorage.getItem('pathwise:accent')||defaultAccent())}" aria-label="Choose accent color"><input type="text" id="accent-color-hex" value="${esc(localStorage.getItem('pathwise:accent')||'#0F6B4F')}" maxlength="7" spellcheck="false" aria-label="Accent color hex code" placeholder="#0F6B4F"><button type="button" class="btn" data-act="accent-reset">Reset</button></div><div class="accent-swatches" aria-label="Preset accent colors">${['#0F6B4F','#2563EB','#7C3AED','#DB2777','#EA580C','#CA8A04','#0891B2','#DC2626','#475569','#111827'].map(c=>`<button type="button" class="accent-swatch" data-act="accent-preset" data-color="${c}" aria-label="Use accent color ${c}" title="${c}" style="--swatch:${c}"></button>`).join('')}</div><p class="mu" id="accent-preview-label">Your accent updates live across buttons, highlights, and the Pathwise logo.</p></div>
<div class="card"><div class="lbl">You</div><p><input data-f="name" value="${esc(S.name)}" aria-label="Name"></p><p><label>Grade <select data-act="grade"><option value="0" ${!S.grade?'selected':''}>Not detected</option>${[9,10,11,12].map(n=>`<option value="${n}" ${S.grade===n?'selected':''}>${n}</option>`).join('')}</select></label></p><p>${schoolSel()}</p><p>${goalSel()}</p></div>
<div class="card"><div class="lbl">GPA weighting</div><p>AP +<input type="number" step=".1" value="${S.w.AP}" data-f="wt" data-l="AP" aria-label="AP bonus"> Honors +<input type="number" step=".1" value="${S.w.Honors}" data-f="wt" data-l="Honors" aria-label="Honors bonus"></p></div>
<div class="card"><div class="lbl">Show these sections</div>${TABS.map(t=>`<label class="t"><input type="checkbox" data-act="show" data-k="${t[0]}" ${S.show[t[0]]!==0?'checked':''}> ${t[1]}</label>`).join('')}</div></div>
<details class="card sp"><summary>Advanced settings and data tools</summary><div class="detailbody">
<h3>School course catalog</h3><div class="card"><p class="mu">Add courses actually offered by your school, including the prerequisite and the minimum grade you need. These entries feed the course planner; they are not guessed from a generic school profile.</p><div class="row"><input id="scn" placeholder="Course name" aria-label="Course name"><select id="scl" aria-label="Course level"><option>CP</option><option>Honors</option><option>AP</option></select><input id="scg" type="number" min="9" max="12" value="11" aria-label="Grade offered"><input id="scp" placeholder="Prerequisite (optional)" aria-label="Prerequisite"><input id="scmin" type="number" min="0" max="100" value="85" aria-label="Minimum grade"><button class="btn p" data-act="addschoolcourse">Add course</button></div><div class="sp">${(S.schoolCourses||[]).map((c,i)=>`<div class="row"><b>${esc(c.n)}</b><span class="mu">${esc(c.l)} · Grade ${c.g} · target ${c.min}%${c.pre?' · Prereq: '+esc(c.pre):''}</span><button class="btn" data-act="delschoolcourse" data-i="${i}">Delete</button></div>`).join('')||'<p class="mu">No school-specific courses added yet.</p>'}</div></div><h3>Grab grades from Genesis (no install)</h3><div class="card"><p>Works on school computers. Make a new browser bookmark, paste the text below as its URL, open your Genesis grades page, click the bookmark, then paste the result into Import below. It reads the page you are already signed in to and never touches your password. Untested against South Brunswick’s Genesis, so check the imported classes.</p><textarea readonly aria-label="Bookmark code" style="min-height:90px" onclick="this.select()">${esc(BM)}</textarea></div><h3>Import your Genesis data</h3><div class="card"><p>A connector on your own device can sign in to Genesis and save your classes as JSON. Paste it here. Format: <code>{"name","grade","courses":[{"n","l":"AP|Honors|CP","p":1,"d":"A|B|AB","r","t","g":95,"c":1,"cats":[{"n":"Tests","w":50,"items":[{"n","s","m"}]}]}]}</code></p>
<textarea id="imp" aria-label="Import JSON" placeholder="Paste JSON here"></textarea><div class="row sp"><button class="btn p" data-act="apply">Import</button><button class="btn" data-act="exp">Export current</button><button class="btn" data-act="reset">Reset to demo</button><button class="btn" data-act="logout">Sign out</button><span id="msg" class="mu"></span></div></div></div></details>`;
const LOGIN=()=>`<div class="pw-auth-stage"><div class="pw-auth-scene" aria-hidden="true"><div class="pw-scene-orbit pw-orbit-one"></div><div class="pw-scene-orbit pw-orbit-two"></div><svg class="pw-scene-svg" viewBox="0 0 520 280" role="presentation"><defs><linearGradient id="pw-line-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8de5bb"/><stop offset="1" stop-color="#5d9eea"/></linearGradient><filter id="pw-glow"><feGaussianBlur stdDeviation="5"/></filter></defs><path class="pw-scene-glow" d="M55 210 C125 210 116 70 205 70 S275 190 355 145 S415 70 465 65"/><path class="pw-scene-line" d="M55 210 C125 210 116 70 205 70 S275 190 355 145 S415 70 465 65"/><circle class="pw-scene-node node-a" cx="55" cy="210" r="7"/><circle class="pw-scene-node node-b" cx="205" cy="70" r="7"/><circle class="pw-scene-node node-c" cx="355" cy="145" r="7"/><circle class="pw-scene-node node-d" cx="465" cy="65" r="7"/></svg><div class="pw-scene-brand"><span class="pw-scene-mark"><svg viewBox="0 0 40 40"><path d="M6 28c8 0 7-15 14-15s5 10 14 10" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="33" cy="10" r="3.4" fill="currentColor"/></svg></span><span>PATHWISE</span><small>YOUR NEXT STEP STARTS HERE</small></div><button id="pw-intro-skip" type="button">Skip intro <span aria-hidden="true">↗</span></button></div><div class="pw-auth-card"><div class="card" style="max-width:520px;margin:30px auto"><div class="lbl">Sign in</div><h2 style="margin-top:6px">Connect your Genesis account</h2><p class="mu">Choose your school, then connect by importing your Genesis data. Live Genesis sign-in requires a district-compatible connector; this standalone HTML cannot safely log in directly across Genesis domains.</p>
<p><select id="gs" aria-label="School" style="width:100%">${schoolEntries().map(([k,v])=>`<option value="${k}" ${k==='sb'?'selected':''}>${v.n}</option>`).join('')}</select></p><p><input id="gu" placeholder="Genesis email or username" autocomplete="username" aria-label="Username" style="width:100%"></p><p><input id="gp" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" style="width:100%"></p>
<form id="genesis-login-form" class="row"><button class="btn p" type="submit" data-act="login">Sign in</button><button class="btn" type="button" data-act="demo">Use the demo student</button></form>
<p class="mu sp">Security note: this standalone page does not send or store your Genesis password. Genesis districts use different portal URLs and browser protections, so live syncing needs a district-compatible local connector. Do not paste your password into this page. Use Settings to import connector JSON or your own exported data.</p></div></div></div>`;
function render(){const touring=!!document.getElementById('pw-tour-shade'),vis=(touring?TABS:TABS.filter(t=>S.show[t[0]]!==0)).concat([['set','Settings']]);if(!vis.some(t=>t[0]===TAB))TAB=vis[0][0];
$('#so').hidden=!S.auth;$('#nav').hidden=!S.auth;$('#topnav').hidden=!S.auth;$('.content-wrap').classList.toggle('signed-out',!S.auth);$('#who').textContent=S.auth?S.name+' ':'';$('#demo').style.display=S.auth&&S.demo?'':'none';const ab=document.getElementById('alerts-toggle');if(ab)ab.textContent=localStorage.getItem('pathwise:alerts')==='1'?'Grade alerts enabled':'Enable grade alerts';
if(!S.auth){$('#nav').innerHTML='';$('#main').innerHTML=LOGIN();return}
const primary=PRIMARY.filter(t=>S.show[t[0]]!==0), extras=MORE_TABS.filter(t=>t[0]==='set'||S.show[t[0]]!==0);$('#topnav').innerHTML=primary.map(t=>`<button class="${t[0]===TAB?'on':''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('');$('#nav').innerHTML=`<div class="nav-caption">Explore</div>`+extras.map(t=>`<button title="${t[1]}" aria-label="${t[1]}" class="${t[0]===TAB?'on':''}" data-act="tab" data-v="${t[0]}"><span class="nav-icon" aria-hidden="true">${NAV_ICONS[t[0]]||'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>'}</span><span class="nav-label">${t[1]}</span></button>`).join('');$('#main').innerHTML=V[TAB]();if(S.open!=null&&TAB==='grades'){calc();const k=S.courses[S.open],el=$('#targetstatus');if(el){const g=gradeOf(k,1),tg=+(k.target??90);el.innerHTML=`<span class="chip ${g<tg?'w':''}">${g<tg?'Behind target':'On track'}</span> Current ${g.toFixed(1)}% · Target ${tg}%${g<tg?` · Need to recover ${(tg-g).toFixed(1)} percentage points`:''}`}}}
function calc(){const k=S.courses[S.open];if(!k||!$('#cr'))return;const t=+$('#ct').value,c=+$('#cc').value,m=+$('#cm').value||100;
const g=x=>{const cp=structuredClone(k);cp.cats[c].items.push({s:x,m,h:0});return gradeOf(cp,1)},g0=g(0),g1=g(m);
$('#cr').textContent=g1-g0<1e-9?'Add some assignments first.':(x=>x>m?`Even a perfect ${m}/${m} only gets you ${g1.toFixed(1)}%.`:x<=0?'You already clear that. Any score works.':`You need ${Math.ceil(x)} / ${m} (${(100*x/m).toFixed(0)}%).`)(m*(t-g0)/(g1-g0))}
function updG(){const k=S.courses[S.open];if(!k||!$('#cg'))return;$('#cg').textContent=gtxt(gradeOf(k,1));$('#ca').textContent=gtxt(gradeOf(k,0));$('#ws').textContent='Total '+k.cats.reduce((a,c)=>a+ +c.w,0)+'%';calc()}
function act(el){const a=el.dataset.act,d=el.dataset,v=el.tagName==='BUTTON'?d.v:el.value;
switch(a){
case'tab':if(v){TAB=v;}break;case'mp':if(S.markingPeriods&&S.markingPeriods[v]){S.markingPeriods[S.markingPeriod]=structuredClone(S.courses);S.markingPeriod=v;S.courses=structuredClone(S.markingPeriods[v]);S.open=null;}break;case'day':S.day=v;break;case'clock':S.clock=v;S.clockAt=Date.now();break;case'clockoff':S.clock='';break;
case'goal':S.goal=v;break;case'grade':S.grade=+v;break;case'school':S.school=v;break;case'st':S.st=v;break;
case'cw':S.cw=el.checked?1:0;break;case'show':S.show[d.k]=el.checked?1:0;break;
case'tgt':{const i=S.targets.indexOf(v);i<0?S.targets.push(v):S.targets.splice(i,1);break}
case'collegeStatus':S.collegeStatus=S.collegeStatus||{};S.collegeStatus[d.v]=el.value;break;
case'clubStatus':S.clubStatus=S.clubStatus||{};S.clubStatus[d.v]=el.value;break;
case'addcollege':{const n=($('#newCollege')||{}).value?.trim();if(!n)return;S.customColleges=S.customColleges||[];if(![...COL,...NICHE_COLLEGES,...S.customColleges].some(c=>norm(c.n)===norm(n)))S.customColleges.push({n,st:(($('#newCollegeState')||{}).value||'Custom').trim(),a:0,s:[S.goal],custom:1});S.targets=S.targets||[];if(!S.targets.includes(n))S.targets.push(n);break}
case'addevent':{const title=($('#eventTitle')||{}).value?.trim();if(!title)return;S.personalEvents=S.personalEvents||[];S.personalEvents.push({title,date:($('#eventDate')||{}).value||'',time:($('#eventTime')||{}).value||'',place:(($('#eventPlace')||{}).value||'').trim(),done:0});break}
case'delevent':(S.personalEvents||[]).splice(+d.i,1);break;
case'eventDone':if(S.personalEvents[+d.i])S.personalEvents[+d.i].done=el.checked?1:0;break
case'open':S.open=+v;break;case'back':S.open=null;break;
case'deli':S.courses[d.i].cats[d.c].items.splice(+d.j,1);break;
case'rw':S.courses[S.open].cats.forEach(c=>c.w=c.gw);break;case'settarget':{const z=+($('#ktarget')||{}).value;if(Number.isFinite(z)&&z>=0&&z<=100)S.courses[S.open].target=z;break}
case'addi':{const s=$('#as').value;if(s==='')return;S.courses[S.open].cats[+$('#ac').value].items.push({n:$('#an').value.trim()||'Assignment',s:+s,m:+$('#am').value||100,due:($('#adue')||{}).value||'',h:$('#ah').checked?1:0});break}
case'addhw':{const t=$('#hwt').value.trim();if(!t)return;S.notes.hw.push({t,c:$('#hwc').value,d:$('#hwd').value,done:0});break}
case'delhw':S.notes.hw.splice(+d.i,1);break;
case'join':{const j=S.notes.join,i=j.indexOf(v);i<0?j.push(v):j.splice(i,1);break}
case'addclub':{const n=$('#ncn').value.trim();if(!n)return;S.myClubs.push(n);break}case'addschoolcourse':{const n=$('#scn').value.trim();if(!n)return;S.schoolCourses=S.schoolCourses||[];S.schoolCourses.push({n,l:$('#scl').value,g:+$('#scg').value||11,pre:$('#scp').value.trim(),min:Math.max(0,Math.min(100,+$('#scmin').value||85))});break}case'delschoolcourse':(S.schoolCourses||[]).splice(+d.i,1);break
case'login':case'demo':if(a==='demo'){const fresh=DEMO();fresh.auth=1;S=fresh;TAB='sched'}else{if($('#gs'))S.school=$('#gs').value;S.auth=1}if($('#gp'))$('#gp').value='';break;
case'logout':S.auth=0;break;
case'reset':{const k=DEMO();k.auth=1;S=k;TAB='sched';break}
case'exp':$('#imp').value=JSON.stringify({name:S.name,grade:S.grade,school:S.school,done:S.done,schoolCourses:S.schoolCourses||[],courses:S.courses},null,1);return;
case'apply':try{const j=JSON.parse($('#imp').value);if(!Array.isArray(j.courses)||!j.courses.length)throw 0;
S.courses=j.courses.map(k=>({n:String(k.n||'Class'),l:['AP','Honors','CP'].includes(k.l)?k.l:'CP',p:Math.min(6,Math.max(1,+k.p||1)),d:['A','B','AB','Unknown'].includes(k.d)?k.d:'Unknown',r:String(k.r||''),t:String(k.t||''),start:String(k.start||''),end:String(k.end||''),periodLabel:String(k.periodLabel||''),g:+k.g||0,c:+k.c||1,target:Number.isFinite(+k.target)?+k.target:90,cats:Array.isArray(k.cats)&&k.cats.length?k.cats.map(c=>({n:String(c.n),w:+c.w||0,gw:+(c.gw??c.w)||0,items:(c.items||[]).map(i=>({n:String(i.n||'Item'),s:+i.s||0,m:+i.m||100,due:String(i.due||i.date||''),h:+i.h?1:0}))})):defCats()}));
if(Array.isArray(j.schedule))S.schedule=j.schedule.filter(x=>x&&x.n).map(x=>({n:String(x.n),p:+x.p||1,periodLabel:String(x.periodLabel||''),d:['A','B','AB','Unknown'].includes(x.d)?x.d:'Unknown',r:String(x.r||''),t:String(x.t||''),start:String(x.start||''),end:String(x.end||''),date:String(x.date||'')}));if(j.name)S.name=String(j.name);if(+j.grade)S.grade=+j.grade;if(Array.isArray(j.done))S.done=j.done.map(String);if(Array.isArray(j.schoolCourses))S.schoolCourses=j.schoolCourses.filter(c=>c&&c.n).map(c=>({n:String(c.n),l:['AP','Honors','CP'].includes(c.l)?c.l:'CP',g:Math.min(12,Math.max(9,+c.g||11)),pre:String(c.pre||''),min:Math.min(100,Math.max(0,+c.min||85))}));if(j.school&&SCH[j.school])S.school=j.school;S.demo=0}catch(e){$('#msg').textContent='That JSON didn’t look right. Check the format above.';return}}
save();render()}
document.addEventListener('click',e=>{if(e.target.closest('#pw-intro-skip')){document.querySelector('.pw-auth-stage')?.classList.add('intro-skipped');return}const b=e.target.closest('button[data-act]');if(b)act(b)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act&&(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='time'))act(t)});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
if(f){const k=S.courses[t.dataset.i],c=t.dataset.c,j=t.dataset.j,v=t.type==='checkbox'?(t.checked?1:0):t.value;
if(f==='is'||f==='im'){k.cats[c].items[j][f==='is'?'s':'m']=v===''?0:+v;updG()}
else if(f==='ih'){k.cats[c].items[j].h=v;save();render();return}
else if(f==='cw'){k.cats[c].w=+v||0;updG()}
else if(f==='name'){S.name=v}
else if(f==='wt')S.w[t.dataset.l]=+v||0;
else if(f==='ng')S.notes.goals=v;else if(f==='nf')S.notes.free=v;
else if(f==='hd'){S.notes.hw[t.dataset.i].done=v;save();render();return}
else if(f==='q'){S.q=v;$('#cl').innerHTML=colList()}
save()}
if(['ct','cc','cm'].includes(t.id))calc()});
setInterval(()=>{const h=$('#hero');if(h&&S.auth&&TAB==='sched')h.innerHTML=heroHtml()},1000);
render();
