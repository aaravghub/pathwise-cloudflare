<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathwise: your schedule, grades and next steps</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%230F6B4F%22/%3E%3Cpath d=%22M12 45c10 0 9-18 19-18s7 12 21 12%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2250%22 cy=%2220%22 r=%226%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Pathwise: frosted mint glass. Tokens first; every rule below reads them. */
:root{
--font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
--bg:#E7F0EC;--ink:#0F2A20;--mute:#4A6458;--line:rgba(15,42,32,.10);
--acc:#58D6A4;--accink:#0E3427;--acc-strong:color-mix(in srgb,var(--acc) 55%,#000);
--soft:rgba(88,214,164,.18);--wbg:#FCEBD3;--warn:#8A4B08;--good:#1C7454;--bad:#B42318;
--glass:rgba(255,255,255,.56);--glass-hi:rgba(255,255,255,.82);--glass-edge:rgba(255,255,255,.85);
--glass-lift:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -12px rgba(16,58,42,.16);
--blur:blur(18px) saturate(170%);
--card:var(--glass-hi);--r:18px;--ease:cubic-bezier(.2,.8,.2,1);
--wash-a:rgba(88,214,164,.42);--wash-b:rgba(143,196,255,.30);--wash-c:rgba(88,214,164,.20);
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0A1511;--ink:#E6F1EC;--mute:#97B0A5;--line:rgba(255,255,255,.08);
--acc:#3DD6A0;--accink:#05241A;--acc-strong:color-mix(in srgb,var(--acc) 72%,#fff);
--soft:rgba(61,214,160,.14);--wbg:#3A2A12;--warn:#F5B14C;--good:#62E3B4;--bad:#FF8A7A;
--glass:rgba(22,38,32,.52);--glass-hi:rgba(26,44,37,.80);--glass-edge:rgba(255,255,255,.09);
--glass-lift:0 1px 0 rgba(255,255,255,.07) inset,0 12px 32px -14px rgba(0,0,0,.6);
--wash-a:rgba(61,214,160,.20);--wash-b:rgba(80,120,200,.16);--wash-c:rgba(61,214,160,.10);
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0A1511;--ink:#E6F1EC;--mute:#97B0A5;--line:rgba(255,255,255,.08);
--acc:#3DD6A0;--accink:#05241A;--acc-strong:color-mix(in srgb,var(--acc) 72%,#fff);
--soft:rgba(61,214,160,.14);--wbg:#3A2A12;--warn:#F5B14C;--good:#62E3B4;--bad:#FF8A7A;
--glass:rgba(22,38,32,.52);--glass-hi:rgba(26,44,37,.80);--glass-edge:rgba(255,255,255,.09);
--glass-lift:0 1px 0 rgba(255,255,255,.07) inset,0 12px 32px -14px rgba(0,0,0,.6);
--wash-a:rgba(61,214,160,.20);--wash-b:rgba(80,120,200,.16);--wash-c:rgba(61,214,160,.10);
color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:90px}
body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top,0px);color:var(--ink);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;isolation:isolate}
/* Static colour wash behind the glass: painted once, never animated or filtered (the old blurred, animated blobs repainted every frame). */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(60vmax 50vmax at 8% -10%,var(--wash-a),transparent 62%),
radial-gradient(50vmax 45vmax at 105% 25%,var(--wash-b),transparent 60%),
radial-gradient(55vmax 40vmax at 40% 115%,var(--wash-c),transparent 60%)}
::selection{background:var(--acc);color:var(--accink)}
:focus-visible{outline:2px solid var(--acc-strong);outline-offset:2px}

/* Glass surfaces. backdrop-filter only on large chrome and cards, never on chips, buttons, inputs or table cells. */
.top,#nav,.topnav,.card,.tour-box,#pw-toast,.pw-load-panel{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-lift);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top,#nav,.topnav,.card,.tour-box,#pw-toast,.pw-load-panel{background:var(--glass-hi)}}
.grid .card{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-hi)}
.card .card{background:var(--soft);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:transparent}

/* Top bar: logo, tools, and the sync button that never leaves the bar. */
.w{max-width:1100px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:35;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;max-width:none;margin:0 0 22px;padding:10px max(20px,env(safe-area-inset-right)) 10px max(24px,env(safe-area-inset-left));border-radius:0;border-width:0 0 1px;min-height:64px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:21px;letter-spacing:-.02em}
.toptools{display:flex;gap:4px;align-items:center;justify-content:flex-start;flex-wrap:nowrap;min-width:0;overflow-x:auto;scrollbar-width:none}
.toptools .btn{background:transparent;border-color:transparent;font-weight:500;color:var(--ink);opacity:.78;min-height:42px;padding:8px 14px}.toptools .btn:hover{opacity:1}
.toptools .btn:hover{background:var(--soft);color:var(--ink)}
.toptools button[aria-pressed=true]{color:var(--ink);background:var(--soft)}
.toptools>:first-child{margin-left:auto}#who{font-weight:600;font-size:14px;margin:0 6px;white-space:nowrap}.toptools .chip{margin:0;white-space:nowrap}
.sync-wrap{display:flex;align-items:center;gap:10px}
.sync-when{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn.sync{display:inline-flex;align-items:center;gap:8px;background:var(--acc);border-color:transparent;color:var(--accink);font-weight:600;padding:8px 16px 8px 13px}
.btn.sync[hidden]{display:none}
.btn.sync svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.sync.busy svg{animation:pw-spin .9s linear infinite}
.btn.sync.idle{background:transparent;border-color:var(--acc-strong);color:var(--acc-strong)}
@keyframes pw-spin{to{transform:rotate(360deg)}}

/* Controls */
.btn,nav button{font:600 14px/1.2 var(--font);color:var(--ink);background:var(--glass-hi);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:42px;cursor:pointer;white-space:nowrap;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s ease}
.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--acc-strong) 40%,transparent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.on,.btn.p{background:var(--acc);border-color:transparent;color:var(--accink)}
.btn.p:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 88%,var(--ink))}
input,select,textarea{font:400 15px/1.3 var(--font);color:var(--ink);background:var(--glass-hi);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;transition:border-color .18s ease,box-shadow .18s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc-strong);box-shadow:0 0 0 3px var(--soft)}
input[type=number]{width:92px;font-variant-numeric:tabular-nums}
input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:var(--acc-strong)}
textarea{width:100%;min-height:150px;resize:vertical}
label.t{display:flex;gap:10px;align-items:center;min-height:44px}
.lk{background:none;border:0;color:var(--ink);font:600 16px var(--font);text-align:left;cursor:pointer;padding:8px 0;min-height:44px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--acc-strong) 45%,transparent);text-underline-offset:4px;text-decoration-thickness:2px}
.lk:hover{text-decoration-color:var(--acc-strong)}

/* Content */
.card{border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:16px 0 22px}
.lbl{font-size:13px;font-weight:600;color:var(--mute)}
.big{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.mu{color:var(--mute);font-size:15px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--good);margin:0 6px 6px 0}
.chip.w{background:var(--wbg);color:var(--warn)}
.up{color:var(--good);font-weight:600}.dn{color:var(--bad);font-weight:600}
.dn2{text-decoration:line-through;opacity:.6}
h2{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:20px 0 6px}
h3{margin:24px 0 10px;font-size:17px;font-weight:650;letter-spacing:-.01em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{margin-top:14px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--mute);padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line)}
tr.hi td{background:var(--soft)}
tbody tr:hover td,tr:hover td{background:color-mix(in srgb,var(--soft) 55%,transparent)}
td input[type=number]{width:80px}
td.pct{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px}
details.recent>summary{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;list-style:none;padding-right:48px}details.recent>summary::-webkit-details-marker{display:none}details.recent>summary::after{content:"";position:absolute;right:22px;top:calc(50% - 7px);width:9px;height:9px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s ease}details.recent[open]>summary::after{transform:rotate(225deg)}.recent-t{font-size:17px}.recent-l{font-weight:500;color:var(--mute);font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
details.card{padding:0}details.card>summary{cursor:pointer;font-weight:600;padding:16px 18px}details.card>.detailbody{padding:0 18px 18px}

/* The "right now" panel: solid mint, the one loud surface in the app. */
.hero{background:var(--acc);color:var(--accink);border-radius:24px;padding:26px 28px;border:0}
.hero .lbl,.hero .mu{color:inherit;opacity:.78}
.clk{font-size:clamp(44px,6vw,64px);font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0}
.clk .cc{font-variant-numeric:normal;margin:0 .02em}
@media (max-width:1120px) and (min-width:701px){#who{display:none}}
.bar{height:7px;width:min(100%,220px);border-radius:6px;background:color-mix(in srgb,var(--accink) 16%,transparent);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accink);border-radius:inherit}

/* Primary tabs: a glass segmented control. */
.topnav{display:flex;gap:4px;padding:4px;margin:0 0 22px;border-radius:999px;width:max-content;max-width:100%}
.topnav[hidden],nav[hidden]{display:none!important}
.topnav button{border:0;background:transparent;color:var(--mute);font:600 15px var(--font);min-height:42px;padding:8px 22px;border-radius:999px;cursor:pointer;transition:background-color .18s ease,color .18s ease}
.topnav button:hover{color:var(--ink)}
.topnav button.on{background:var(--acc);color:var(--accink)}

/* Side rail: icons at rest, labels on hover or focus. It overlays the page instead of pushing it. */
#nav{position:fixed;z-index:30;left:14px;top:50%;transform:translateY(-50%);max-height:calc(100vh - 140px);width:62px;display:flex;flex-direction:column;gap:4px;padding:10px 8px;border-radius:20px;overflow:hidden auto;white-space:nowrap;transition:width .26s var(--ease)}
#nav:hover,#nav:focus-within{width:232px;background:var(--glass-hi)}
#nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 0 0 10px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:500;text-align:left}
#nav button:hover{background:var(--soft);color:var(--ink)}
#nav button.on{background:var(--soft);color:var(--ink)}
#nav button.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--acc-strong)}
.nav-icon{display:inline-flex;flex:0 0 24px;width:24px;height:24px}
.nav-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-label{opacity:0;transition:opacity .16s ease}
#nav:hover .nav-label,#nav:focus-within .nav-label{opacity:1}
.nav-caption{font-size:12px;font-weight:600;color:var(--mute);padding:4px 10px 6px;opacity:0;transition:opacity .16s ease}
#nav:hover .nav-caption,#nav:focus-within .nav-caption{opacity:1}
.content-wrap{margin-left:90px}
.content-wrap.signed-out{margin-left:0}
body:has(.content-wrap.signed-out) #nav{display:none!important}

footer{padding:40px 24px 48px;text-align:center;color:var(--mute);font-size:13.5px;max-width:720px;margin:0 auto}

/* Accent settings */
.accent-picker-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.accent-picker-row input[type=color]{width:56px;height:46px;padding:4px;cursor:pointer}
.accent-picker-row input[type=text]{width:124px;font-variant-numeric:tabular-nums;font-weight:600;text-transform:uppercase}
.accent-swatches{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.accent-swatch{width:30px;height:30px;border-radius:50%;background:var(--swatch);border:3px solid var(--glass-hi);outline:1px solid var(--line);cursor:pointer;transition:transform .15s ease}
.accent-swatch:hover{transform:scale(1.12)}
.accent-swatch[aria-pressed=true]{outline:2px solid var(--acc-strong)}

/* Tour and toast */
.tour-shade{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(6,20,14,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tour-box{width:min(520px,100%);background:var(--glass-hi);color:var(--ink);border-radius:24px;padding:24px}
.tour-box h2{margin-top:8px}.tour-box .mu{margin:10px 0 18px}
.tour-progress{height:5px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0}
.tour-progress i{display:block;height:100%;background:var(--acc);transition:width .2s}
#pw-toast{position:fixed;left:12px;right:12px;bottom:16px;z-index:60;max-width:520px;margin:0 auto;padding:13px 18px;border-radius:16px;background:var(--glass-hi);color:var(--ink);font-weight:500;font-size:14px;white-space:pre-line;border-left:4px solid var(--acc)}

/* Sign-in: the climbing scene beside the form. */
.pw-auth-stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:stretch;min-height:calc(100dvh - 190px);padding:4px 0 20px}
.pw-ladder{position:relative;min-height:440px;border-radius:28px;overflow:hidden;background:color-mix(in srgb,var(--glass) 70%,transparent);border:1px solid var(--glass-edge)}
.pw-ladder canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pw-ladder-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--acc-strong);transition:opacity .4s ease}
.pw-ladder-fallback svg{width:96px;height:96px}
.pw-ladder.has-scene .pw-ladder-fallback{opacity:0}
.pw-ladder-copy{position:absolute;left:24px;bottom:22px;right:24px;z-index:1;max-width:30ch}
.pw-ladder-copy h1{font-size:clamp(28px,3.4vw,42px);line-height:1.05;letter-spacing:-.035em;margin:0 0 8px;font-weight:700}
.pw-ladder-copy p{margin:0;color:var(--mute)}
.pw-auth-card{align-self:center}
.pw-auth-card .card{padding:28px}
.pw-auth-card h2{margin-top:0}
.pw-auth-card input,.pw-auth-card select{width:100%}

/* Sign-in loading overlay: the same scene, full screen. */
#pw-login-loading{position:fixed;inset:0;z-index:9999;background:var(--bg);animation:pw-fade .3s ease both}
#pw-login-loading::before{content:"";position:absolute;inset:0;background:inherit;background:
radial-gradient(60vmax 50vmax at 8% -10%,var(--wash-a),transparent 62%),radial-gradient(50vmax 45vmax at 105% 25%,var(--wash-b),transparent 60%)}
#pw-load-scene{position:absolute;inset:0}
#pw-load-scene canvas{width:100%;height:100%;display:block}
.pw-load-panel{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(460px,calc(100% - 32px));padding:20px 22px;border-radius:22px}
.pw-load-panel h1{font-size:24px;letter-spacing:-.025em;line-height:1.15;margin:0 0 6px}
.pw-load-panel p{margin:0;color:var(--mute);font-size:14.5px}
.pw-load-status{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;font-size:14px}
.pw-load-status i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pw-blink 1.2s ease-in-out infinite}
@keyframes pw-fade{from{opacity:0}}
@keyframes pw-blink{50%{opacity:.35}}

@media (max-width:900px){.pw-auth-stage{grid-template-columns:1fr;min-height:0}.pw-ladder{min-height:300px}}
@media (max-width:700px){
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body:has(.content-wrap.signed-out){padding-bottom:0}
.w{padding:0 14px}
.top{margin:0 0 14px;padding:8px 10px 8px 14px;grid-template-columns:1fr auto;gap:6px 10px}
.logo{font-size:19px}
.sync-wrap{grid-column:2;grid-row:1}
.sync-when{display:none}
.toptools{grid-column:1/-1;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.toptools .btn{font-size:13px;min-height:36px;padding:6px 10px}
#nav{left:8px;right:8px;top:auto;transform:none;max-height:none;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;height:auto;flex-direction:row;padding:6px;border-radius:20px;overflow:auto hidden}
#nav:hover,#nav:focus-within{width:auto}
#nav .nav-caption{display:none}
#nav button{flex:1 0 auto;width:auto;min-width:62px;min-height:52px;flex-direction:column;justify-content:center;gap:3px;padding:6px 8px;font-size:11px}
#nav button.on::before{display:none}
#nav .nav-label{opacity:1;font-size:10.5px}
.content-wrap{margin-left:0}
.topnav{width:100%}
.topnav button{flex:1;padding:8px 10px;font-size:14px}
.grid{grid-template-columns:minmax(0,1fr)}
.card{padding:15px;min-width:0}
.row input,.row select{max-width:100%;min-width:0;flex:1 1 140px}
table,.sc table{min-width:560px}
input[type=number]{width:76px}
.hero{padding:22px 20px;border-radius:22px}
h2{font-size:24px}
.pw-ladder{min-height:240px;border-radius:22px}
.pw-ladder-copy{left:18px;bottom:16px}
.pw-auth-card .card{padding:20px 18px}
}

/* Bolder pass: a pine field for "right now", the day as a ladder, bigger type, the logo path behind everything. */
:root{--hero-bg:#145240;--hero-ink:#ECF8F2;--hero-mute:rgba(236,248,242,.66);--hero-line:rgba(236,248,242,.16)}
:root[data-theme="dark"]{--hero-bg:#17503E;--hero-line:rgba(236,248,242,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero-bg:#17503E}}
.bg-path{position:fixed;z-index:-1;right:-8vmax;bottom:-12vmax;width:78vmax;height:78vmax;pointer-events:none;color:var(--acc);opacity:.22}
.bg-path path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.bg-path circle{fill:currentColor}
h2{font-size:clamp(30px,3.6vw,44px);letter-spacing:-.035em;line-height:1.05;margin:24px 0 10px}
.big{font-size:clamp(30px,3vw,40px);letter-spacing:-.035em}
.g4 .card{padding:20px 22px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px 40px;align-items:center;background:var(--hero-bg);color:var(--hero-ink);border-radius:28px;padding:32px 36px}
.hero .lbl,.hero .mu{color:var(--hero-mute);opacity:1}
.hero .lbl{font-size:14px}
.hero .clk{font-size:clamp(52px,7.4vw,92px);letter-spacing:-.045em;margin:4px 0 10px;color:var(--hero-ink)}
.hero-a{font-size:clamp(22px,2.2vw,28px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:4px}
.hero .bar{width:min(100%,280px);height:8px;background:var(--hero-line);margin-top:16px}
.hero .bar i{background:var(--acc)}
.hero-day{justify-self:end;display:grid;grid-template-columns:auto auto;align-items:end;column-gap:10px;text-align:left}
.hd-w{grid-column:1/-1;font-size:15px;font-weight:600;color:var(--hero-mute)}
.hd-l{font-size:clamp(110px,14vw,180px);font-weight:700;line-height:.82;letter-spacing:-.06em;color:var(--acc)}

.hero-day small{grid-column:1/-1;margin-top:14px;font-size:13.5px;color:var(--hero-mute);max-width:26ch}
.hero .hd-back{color:var(--hero-ink);font-size:13.5px;min-height:0;padding:0}
@media (max-width:820px){.hero{grid-template-columns:1fr auto;padding:24px 22px;gap:16px}.hd-l{font-size:96px}.hd-s{font-size:26px}.hero-day small{display:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)act(b)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act&&(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='time'))act(t)});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
if(f){const k=S.courses[t.dataset.i],c=t.dataset.c,j=t.dataset.j,v=t.type==='checkbox'?(t.checked?1:0):t.value;
if(f==='is'||f==='im'){k.cats[c].items[j][f==='is'?'s':'m']=v===''?0:+v;const pc=t.closest('tr')?.querySelector('.pct');if(pc)pc.textContent=pctTxt(k.cats[c].items[j]);updG()}
else if(f==='ih'){k.cats[c].items[j].h=v;save();render();return}
else if(f==='cw'){k.cats[c].w=+v||0;updG()}
else if(f==='name'){S.name=v}
else if(f==='wt')S.w[t.dataset.l]=+v||0;
else if(f==='ng')S.notes.goals=v;else if(f==='nf')S.notes.free=v;
else if(f==='hd'){S.notes.hw[t.dataset.i].done=v;save();render();return}
else if(f==='q'){S.q=v;$('#cl').innerHTML=colList()}
saveSoon()}
if(['ct','cc','cm'].includes(t.id))calc()});
setInterval(()=>{const h=!document.hidden&&$('#hero');if(h&&S.auth&&TAB==='sched')h.innerHTML=heroHtml()},1000);
render();
</script>
<script src="/connector.js"></script>
</body>
